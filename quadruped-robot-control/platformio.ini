; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = time
extra_scripts = pre:extra_script.py
lib_deps = 
	jvpernis/PS3 Controller Host@^1.1.0
	4-20ma/ModbusMaster@^2.0.1
	https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-humble

[env:native]
platform = native
test_framework = unity
build_flags = 
	-Os
	-std=gnu++17
	-DPIO_UNIT_TESTING
	-I test/test_support/config
	-I test/test_support
	-I test
	-I .
build_src_filter = 
	+<src/config/>
	+<src/domain/>
	+<src/service/>
	+<test/test_support/config/millis_stub.cpp>
	-<src/main.cpp>
	-<src/driver/CommandInputSpi.cpp>
	-<src/driver/CommandInputPs3.cpp>
	-<src/driver/DynamixelBusDriver.cpp>
	-<src/platform/>
test_ignore = test_arduino
lib_deps = 4-20ma/ModbusMaster@^2.0.1
